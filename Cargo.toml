[package]
name = "tfdiff"
version = "1.0.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Your Name <your.email@example.com>"]
description = "A beautiful console tool for displaying Terraform plan and apply diffs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/yourusername/tfdiff"
keywords = ["terraform", "diff", "console", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
sha2 = "0.10"
lazy_static = "1.4"
libc = "0.2"
colored = "2.1"
unicode-width = "0.1"
term_size = "0.3"
atty = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.2"
chrono-tz = "0.10"
globset = "0.4"
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1.12.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-cloudtrail = { version = "1.125.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
async-trait = "0.1"
aws-credential-types = "1.3.0"
aws-smithy-runtime-api = "1.19.0"
aws-smithy-types = "1.8.1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
notify = "6.0"
indicatif = "0.17"
comfy-table = "7.0"
similar = "2.3"
syntect = "5.0"
thiserror = "1.0"
anyhow = "1.0"
flate2 = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
serde_json = "1.0"
insta = "1.34"
proptest = "1.4"
criterion = "0.5"
mockall = "0.12"

[[bench]]
name = "parser_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[[bin]]
name = "tfdiff"
path = "src/main.rs"